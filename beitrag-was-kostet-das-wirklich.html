  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html { scroll-behavior: smooth; scroll-padding-top: 96px; }\n  body { margin: 0; background: #f7f2eb; color: #3f4b43; font-family: \"Figtree\", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\n  * { box-sizing: border-box; }\n  a { color: #22567c; text-decoration-thickness: 1px; text-underline-offset: 3px; }\n  a:hover { color: #8f6927; }\n  :focus-visible { outline: 3px solid #8f6927; outline-offset: 3px; border-radius: 2px; }\n  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#f7f2eb; overflow-x:clip\">\n  <dc-import name=\"SiteHeader\" active=\"wissen\" hint-size=\"100%,76px\"><\u002Fdc-import>\n\n  <main style=\"padding-top:76px\">\n\n    <section style=\"position:relative; width:100%; min-height:clamp(460px,62vh,660px); display:flex; align-items:center; isolation:isolate; overflow:hidden\">\n      <img src=\"61497c49-d464-4c37-8415-b644efc1f1f6\" alt=\"Holztisch mit Unterlagen, Brille und Notizbuch vor einer Fensterfront\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 55%; z-index:-2\">\n      <div aria-hidden=\"true\" style=\"position:absolute; inset:0; z-index:-1; background:linear-gradient(170deg, rgba(34,86,124,0.16) 0%, rgba(34,86,124,0.03) 34%, rgba(25,85,50,0.08) 62%, rgba(18,58,34,0.38) 100%); mix-blend-mode:multiply\"><\u002Fdiv>\n      <img src=\"9add00d2-58bc-42ee-b7e0-aa1b62559c5d\" alt=\"\" aria-hidden=\"true\" style=\"position:absolute; left:0; bottom:0; width:100%; height:52%; object-fit:cover; object-position:top; z-index:-1; pointer-events:none; opacity:0.5; mix-blend-mode:screen\">\n      <img data-wave-slide=\"1\" src=\"39394ff0-ce8e-4417-b25f-1edf2b2997ed\" alt=\"\" aria-hidden=\"true\" style=\"position:absolute; left:0; top:-34%; width:100%; height:60%; object-fit:cover; z-index:-1; pointer-events:none; will-change:transform; transform:translateY(0)\">\n      <div style=\"width:100%; max-width:1240px; margin:0 auto; padding:clamp(56px,7vw,96px) clamp(18px,4vw,40px)\">\n        <div data-rv=\"1\" style=\"opacity:0; transform:translateY(20px); transition:opacity .8s ease, transform .8s ease; position:relative; box-sizing:border-box; max-width:min(600px,100%); padding:clamp(30px,4vw,56px); border-radius:10px; background:rgba(247,242,235,0.70); backdrop-filter:blur(22px) saturate(1.15); -webkit-backdrop-filter:blur(22px) saturate(1.15); border:1px solid rgba(255,253,249,0.6); box-shadow:0 26px 64px rgba(25,85,50,0.20)\">\n          <p style=\"text-transform:uppercase; letter-spacing:0.18em; font-size:12.5px; font-weight:700; color:#8f6927; margin:0 0 22px\">Wissenswertes · Kosten &amp; Zahlen<\u002Fp>\n          <h2 style=\"font-size:clamp(26px,3.4vw,40px); line-height:1.07; letter-spacing:-0.03em; font-weight:600; color:#195532; margin:0; text-wrap:pretty\">Was kostet das wirklich?<\u002Fh2>\n          <p style=\"margin:20px 0 0; font-size:17px; line-height:1.7; color:#22567c; text-wrap:pretty\">Fünf Kostenblöcke, die in keiner Bilanz stehen — und wie Sie sie für Ihr Unternehmen konservativ beziffern.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"position:sticky; top:76px; z-index:0; background:#fffdf9; border-bottom:1px solid rgba(25,85,50,0.10); padding:clamp(64px,8vw,110px) 0 clamp(56px,7vw,96px)\">\n      <div data-rv=\"1\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s ease .1s, transform .7s ease .1s; max-width:76em; margin:0 auto; padding:0 clamp(18px,4vw,40px); text-align:center\">\n        <h1 style=\"margin:0 0 18px; font-size:clamp(30px,3.9vw,48px); line-height:1.07; letter-spacing:-0.03em; font-weight:600; color:#195532; text-wrap:pretty\">Schlechte Führung hat einen Preis. Er steht nur nirgends.<\u002Fh1>\n        <p style=\"margin:0 auto; max-width:38em; font-size:17px; line-height:1.7; text-wrap:pretty\">Jedes Unternehmen kennt seine Materialkosten auf den Cent. Was ein ungelöster Konflikt kostet, weiß fast niemand — weil die Rechnung dafür nie kommt. Sie verteilt sich auf Kündigungen, Krankmeldungen, verlorene Führungszeit und Anwaltshonorare. Dieser Beitrag setzt sie zusammen.<\u002Fp>\n        <p style=\"margin:20px auto 0; font-size:13.5px; letter-spacing:0.08em; text-transform:uppercase; font-weight:600; color:#8f6927\">Lesezeit 6 Minuten · Gründer-Duo h2b<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div style=\"position:relative; z-index:1; background:#f7f2eb; box-shadow:0 -10px 28px rgba(18,58,34,0.05)\">\n\n    <section style=\"padding:clamp(56px,7vw,96px) 0 0\">\n      <div style=\"max-width:1240px; margin:0 auto; padding:0 clamp(18px,4vw,40px)\">\n        <div data-rv=\"1\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s ease; max-width:760px\">\n          <h3 style=\"margin:0 0 14px; font-size:clamp(22px,2.6vw,30px); font-weight:600; color:#195532; letter-spacing:-0.02em; line-height:1.2\">Warum die Kosten unsichtbar bleiben<\u002Fh3>\n          <p style=\"margin:0 0 16px; font-size:17px; line-height:1.7\">Eine Bilanz kennt Kostenstellen, keine Ursachen. Wenn eine Mitarbeiterin kündigt, taucht das als Recruiting-Aufwand und vielleicht als Zeitarbeit auf — nicht als Folge einer Führungskraft, die seit zwei Jahren keine Rückmeldung gibt. Wenn die Krankheitsquote eines Standorts drei Punkte über den anderen liegt, ist das eine Zahl im Personalbericht. Warum sie dort steht, fragt selten jemand.<\u002Fp>\n          <p style=\"margin:0 0 16px; font-size:17px; line-height:1.7\">Das ist der Grund, warum schlechte Führung im Mittelstand so lange durchgehalten wird: Nicht, weil niemand sie bemerkt, sondern weil niemand sie in Euro sieht. Was nicht beziffert ist, hat im Budgetgespräch keine Stimme.<\u002Fp>\n        <\u002Fdiv>\n\n        <div data-rv=\"1\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s ease; margin-top:clamp(40px,5vw,64px)\">\n          <h3 style=\"margin:0 0 14px; font-size:clamp(22px,2.6vw,30px); font-weight:600; color:#195532; letter-spacing:-0.02em; line-height:1.2\">Die fünf Kostenblöcke<\u002Fh3>\n          <p style=\"margin:0 0 28px; font-size:17px; line-height:1.7; max-width:760px\">Aus Personalcontrolling, Arbeitsrecht und Konfliktforschung lassen sich fünf Positionen ableiten, die in praktisch jedem Unternehmen auftreten. Die Bandbreiten sind bewusst konservativ gewählt.<\u002Fp>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:clamp(14px,1.8vw,22px)\">\n            <div style=\"background:#fffdf9; border:1px solid rgba(25,85,50,0.13); border-radius:8px; padding:clamp(22px,2.6vw,30px)\">\n              <p style=\"margin:0 0 8px; font-size:12.5px; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; color:#8f6927\">1 · Fluktuation<\u002Fp>\n              <p style=\"margin:0 0 10px; font-size:19px; font-weight:600; color:#195532; line-height:1.3\">0,5–1,5 Jahresgehälter pro Abgang<\u002Fp>\n              <p style=\"margin:0; font-size:16px; line-height:1.65\">Recruiting, Einarbeitung, Produktivitätsverlust in den ersten Monaten, verlorenes Wissen. Der Wert gilt pro Stelle — nicht pro Jahr.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:#fffdf9; border:1px solid rgba(25,85,50,0.13); border-radius:8px; padding:clamp(22px,2.6vw,30px)\">\n              <p style=\"margin:0 0 8px; font-size:12.5px; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; color:#8f6927\">2 · Fehlzeiten<\u002Fp>\n              <p style=\"margin:0 0 10px; font-size:19px; font-weight:600; color:#195532; line-height:1.3\">400–700 € pro Ausfalltag<\u002Fp>\n              <p style=\"margin:0; font-size:16px; line-height:1.65\">Lohnfortzahlung plus Ausfall der Arbeitsleistung. Relevant ist der Anteil oberhalb des Bundesdurchschnitts von rund 5,5 Prozent.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:#fffdf9; border:1px solid rgba(25,85,50,0.13); border-radius:8px; padding:clamp(22px,2.6vw,30px)\">\n              <p style=\"margin:0 0 8px; font-size:12.5px; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; color:#8f6927\">3 · Führungszeit<\u002Fp>\n              <p style=\"margin:0 0 10px; font-size:19px; font-weight:600; color:#195532; line-height:1.3\">15–30 % der Führungskräftezeit<\u002Fp>\n              <p style=\"margin:0; font-size:16px; line-height:1.65\">So viel Zeit verbringen Führungskräfte laut Studien mit Konflikten. Ein Teil davon ist normale Führungsarbeit — der Rest ist vermeidbar.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:#fffdf9; border:1px solid rgba(25,85,50,0.13); border-radius:8px; padding:clamp(22px,2.6vw,30px)\">\n              <p style=\"margin:0 0 8px; font-size:12.5px; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; color:#8f6927\">4 · Rechtliche Risiken<\u002Fp>\n              <p style=\"margin:0 0 10px; font-size:19px; font-weight:600; color:#195532; line-height:1.3\">10.000–80.000 € pro Fall<\u002Fp>\n              <p style=\"margin:0; font-size:16px; line-height:1.65\">Anwaltskosten, Abfindungen, Vergleiche — und die Zeit von Geschäftsführung und HR, die ein Verfahren bindet.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:#fffdf9; border:1px solid rgba(25,85,50,0.13); border-radius:8px; padding:clamp(22px,2.6vw,30px)\">\n              <p style=\"margin:0 0 8px; font-size:12.5px; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; color:#8f6927\">5 · Produktivität<\u002Fp>\n              <p style=\"margin:0 0 10px; font-size:19px; font-weight:600; color:#195532; line-height:1.3\">20–40 % Teamleistung<\u002Fp>\n              <p style=\"margin:0; font-size:16px; line-height:1.65\">Der am schwersten messbare Block — und deshalb der einzige, den wir im Humanity Check bewusst nicht mitrechnen.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-rv=\"1\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s ease; margin-top:clamp(40px,5vw,64px); max-width:760px\">\n          <h3 style=\"margin:0 0 14px; font-size:clamp(22px,2.6vw,30px); font-weight:600; color:#195532; letter-spacing:-0.02em; line-height:1.2\">Eine Beispielrechnung<\u002Fh3>\n          <p style=\"margin:0 0 16px; font-size:17px; line-height:1.7\">Nehmen wir ein Unternehmen mit 120 Mitarbeitenden, einem durchschnittlichen Jahresgehalt von 55.000 Euro inklusive Nebenkosten und zwölf Führungskräften. Acht Mitarbeitende gehen pro Jahr, die Krankheitsquote liegt bei 6,5 Prozent, drei Konflikte sind in den letzten zwölf Monaten eskaliert.<\u002Fp>\n          <p style=\"margin:0 0 16px; font-size:17px; line-height:1.7\">Rechnet man nur den führungsbedingten Anteil — also 60 Prozent der Abgänge, nur die Krankheitsquote oberhalb des Bundesdurchschnitts und nur die vermeidbare Konfliktzeit der Führungskräfte —, ergibt sich:<\u002Fp>\n        <\u002Fdiv>\n        <div data-rv=\"1\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s ease; margin-top:22px; max-width:760px; background:#fffdf9; border:1px solid rgba(25,85,50,0.14); border-radius:8px; padding:clamp(22px,2.8vw,34px)\">\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:1px solid rgba(25,85,50,0.10); font-size:16.5px\"><span>Fluktuation und Ersatz<\u002Fspan><span style=\"font-weight:600; color:#195532\">198.000 €<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:1px solid rgba(25,85,50,0.10); font-size:16.5px\"><span>Führungszeitverlust<\u002Fspan><span style=\"font-weight:600; color:#195532\">92.400 €<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:1px solid rgba(25,85,50,0.10); font-size:16.5px\"><span>Eskalierte Konflikte<\u002Fspan><span style=\"font-weight:600; color:#195532\">67.500 €<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:1px solid rgba(25,85,50,0.10); font-size:16.5px\"><span>Krankheitsbedingte Ausfälle<\u002Fspan><span style=\"font-weight:600; color:#195532\">39.600 €<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:14px 0 0; font-size:18px; font-weight:700; color:#195532\"><span>Pro Jahr<\u002Fspan><span style=\"color:#8f6927\">397.500 €<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-rv=\"1\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s ease; margin-top:22px; max-width:760px\">\n          <p style=\"margin:0 0 16px; font-size:17px; line-height:1.7\">Rund 400.000 Euro — mehr als sieben Jahresgehälter. Ohne den Produktivitätsblock, ohne Reputationsschäden, ohne die Kündigungen, die erst nächstes Jahr kommen. Das ist die konservative Untergrenze, nicht die Wahrheit.<\u002Fp>\n          <p style=\"margin:0; font-size:17px; line-height:1.7\">Wer diese Zahl zum ersten Mal für sein eigenes Unternehmen sieht, reagiert meist gleich: erst Zweifel, dann Nachrechnen, dann Stille. Genau dieser Moment ist der Anfang von Steuerung.<\u002Fp>\n        <\u002Fdiv>\n\n        <div data-rv=\"1\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s ease; margin-top:clamp(40px,5vw,64px); background:#195532; color:#f7f2eb; border-radius:8px; padding:clamp(28px,3.6vw,48px)\">\n          <p style=\"margin:0; font-size:17px; line-height:1.7; font-weight:700; text-wrap:pretty\">Konflikte sind keine Störung. Sie sind messbare Daten. <span style=\"font-weight:400; opacity:0.85\">Wer sie zählt, kann sie steuern — und wer sie steuert, muss sie nicht mehr bezahlen.<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n\n        <div data-rv=\"1\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s ease; margin-top:clamp(40px,5vw,64px); max-width:760px\">\n          <h3 style=\"margin:0 0 14px; font-size:clamp(22px,2.6vw,30px); font-weight:600; color:#195532; letter-spacing:-0.02em; line-height:1.2\">Wie Sie es für Ihr Unternehmen rechnen<\u002Fh3>\n          <p style=\"margin:0 0 16px; font-size:17px; line-height:1.7\">Sie brauchen sechs Zahlen, die in jedem Unternehmen vorliegen: Mitarbeitende, durchschnittliches Jahresgehalt, Anzahl Führungskräfte, Abgänge pro Jahr, Krankheitsquote und die Zahl ernsthafter Konflikte der letzten zwölf Monate. Zählen Sie bei den Konflikten großzügig: Abmahnungen, Versetzungen, Aufhebungsverträge und Teamkonflikte, die HR beschäftigt haben.<\u002Fp>\n          <p style=\"margin:0 0 26px; font-size:17px; line-height:1.7\">Der Humanity Check auf unserer Startseite rechnet das mit genau dieser Logik in zwei Minuten durch — mit denselben konservativen Faktoren wie in diesem Beitrag.<\u002Fp>\n          <div style=\"display:flex; flex-wrap:wrap; gap:12px\">\n            <a href=\"index.html#humanity-check\" style=\"background:#195532; color:#f7f2eb; text-decoration:none; font-weight:600; font-size:16px; padding:15px 26px; border-radius:999px; min-height:44px; display:inline-flex; align-items:center\" style-hover=\"background:#12421f\">Zum Humanity Check<\u002Fa>\n            <a href=\"kontakt.html\" style=\"color:#22567c; text-decoration:none; font-weight:600; font-size:16px; padding:15px 24px; border-radius:999px; border:1.5px solid rgba(34,86,124,0.3); min-height:44px; display:inline-flex; align-items:center\" style-hover=\"border-color:#22567c\">Zahlen im Gespräch prüfen<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:clamp(56px,7vw,100px) 0 clamp(64px,8vw,110px)\">\n      <div style=\"max-width:1240px; margin:0 auto; padding:clamp(48px,6vw,80px) clamp(18px,4vw,40px) 0; border-top:1px solid rgba(25,85,50,0.12)\">\n        <h3 data-rv=\"1\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s ease; margin:0 0 22px; font-size:clamp(22px,2.6vw,30px); font-weight:600; color:#195532; letter-spacing:-0.02em\">Weitere Beiträge<\u002Fh3>\n        <div data-rv=\"1\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s ease; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:clamp(14px,1.8vw,24px)\">\n          <a href=\"beitrag-fuehrung-neu-denken.html\" style=\"text-decoration:none; color:inherit; background:#fffdf9; border:1px solid rgba(25,85,50,0.13); border-radius:8px; padding:clamp(22px,2.6vw,30px); display:flex; flex-direction:column; gap:10px\" style-hover=\"border-color:#8f6927\">\n            <p style=\"margin:0; font-size:12.5px; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; color:#8f6927\">Haltung · 5 Min.<\u002Fp>\n            <h4 style=\"margin:0; font-size:20px; font-weight:600; color:#195532; line-height:1.3\">Führung neu denken<\u002Fh4>\n            <span style=\"font-weight:600; color:#22567c; font-size:15.5px\">Beitrag lesen →<\u002Fspan>\n          <\u002Fa>\n          <a href=\"beitrag-humanity-system-im-detail.html\" style=\"text-decoration:none; color:inherit; background:#fffdf9; border:1px solid rgba(25,85,50,0.13); border-radius:8px; padding:clamp(22px,2.6vw,30px); display:flex; flex-direction:column; gap:10px\" style-hover=\"border-color:#8f6927\">\n            <p style=\"margin:0; font-size:12.5px; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; color:#8f6927\">Das System · 7 Min.<\u002Fp>\n            <h4 style=\"margin:0; font-size:20px; font-weight:600; color:#195532; line-height:1.3\">Humanity System™ im Detail<\u002Fh4>\n            <span style=\"font-weight:600; color:#22567c; font-size:15.5px\">Beitrag lesen →<\u002Fspan>\n          <\u002Fa>\n          <a href=\"wissenswertes.html\" style=\"text-decoration:none; color:inherit; border:1px dashed rgba(25,85,50,0.3); border-radius:8px; padding:clamp(22px,2.6vw,30px); display:flex; flex-direction:column; justify-content:center; gap:10px\" style-hover=\"border-color:#8f6927\">\n            <span style=\"font-weight:600; color:#22567c; font-size:16px\">← Alle Beiträge in „Wissenswertes\"<\u002Fspan>\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fmain>\n\n  <dc-import name=\"SiteFooter\" hint-size=\"100%,480px\"><\u002Fdc-import>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (!reduce) {\n      let raf = 0;\n      const wave = () => document.querySelector('[data-wave-slide]');\n      this.onWaveScroll = () => {\n        if (raf) return;\n        raf = requestAnimationFrame(() => {\n          raf = 0;\n          const el = wave();\n          if (!el) return;\n          const hero = el.parentElement;\n          const hh = hero ? hero.offsetHeight : window.innerHeight;\n          const p = Math.min(1.4, Math.max(0, window.scrollY / Math.max(1, hh)));\n          el.style.transform = 'translateY(' + (p * hh * 1.15).toFixed(1) + 'px)';\n          el.style.opacity = String(Math.max(0, 1 - p * 0.7));\n        });\n      };\n      window.addEventListener('scroll', this.onWaveScroll, { passive: true });\n      this.onWaveScroll();\n    }\n    const pending = new Set();\n    const show = (el) => { el.style.opacity = '1'; el.style.transform = 'none'; pending.delete(el); };\n    const io = (!reduce && 'IntersectionObserver' in window)\n      ? new IntersectionObserver((entries) => {\n          entries.forEach((e) => { if (e.isIntersecting) { show(e.target); io.unobserve(e.target); } });\n        }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 })\n      : null;\n    const inView = (el) => { const r = el.getBoundingClientRect(); return r.top < window.innerHeight * 0.95 && r.bottom > 0; };\n    const seen = new WeakSet();\n    const scan = () => {\n      document.querySelectorAll('[data-rv]').forEach((n) => {\n        if (seen.has(n)) return;\n        seen.add(n);\n        if (!io) { show(n); return; }\n        pending.add(n);\n        io.observe(n);\n      });\n      pending.forEach((n) => { if (inView(n)) { show(n); if (io) io.unobserve(n); } });\n    };\n    const revealAll = () => {\n      document.querySelectorAll('[data-rv]').forEach(show);\n      if (io) io.disconnect();\n      if (this.mo) this.mo.disconnect();\n      window.removeEventListener('scroll', scan);\n    };\n    this.io = io; this.onScroll = scan;\n    scan();\n    this.mo = new MutationObserver(scan);\n    this.mo.observe(document.body, { childList: true, subtree: true });\n    window.addEventListener('scroll', scan, { passive: true });\n    this.ticks = [0, 60, 200, 600, 1500, 3000].map((t) => setTimeout(scan, t));\n    this.stopMo = setTimeout(() => { if (this.mo) this.mo.disconnect(); }, 8000);\n    this.safety = setTimeout(revealAll, 4000);\n  }\n  componentWillUnmount() {\n    if (this.onWaveScroll) window.removeEventListener('scroll', this.onWaveScroll);\n    if (this.io) this.io.disconnect();\n    if (this.mo) this.mo.disconnect();\n    window.removeEventListener('scroll', this.onScroll);\n    (this.ticks || []).forEach(clearTimeout);\n    clearTimeout(this.stopMo);\n    clearTimeout(this.safety);\n  }\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
